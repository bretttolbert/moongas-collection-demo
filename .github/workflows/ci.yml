name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out moongas-mediascan-golang
        uses: actions/checkout@v4
        with:
          repository: 'bretttolbert/moongas-mediascan-golang'
          path: 'moongas-mediascan-golang'

      - name: Check out moongas-mediascan-python
        uses: actions/checkout@v4
        with:
          repository: 'bretttolbert/moongas-mediascan-python'
          path: 'moongas-mediascan-python'

      - name: Check out moongas-py-mediatest
        uses: actions/checkout@v4
        with:
          repository: 'bretttolbert/moongas-py-mediatest'
          path: 'moongas-py-mediatest'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and Install Go Module
        run: |
          cd moongas-mediascan-golang
          go install ./...

      - name: Run Go scanartistsyaml
        run: |
          go -C "$GITHUB_WORKSPACE/moongas-mediascan-golang" run ./cmd/mediascan-artists-yaml "$GITHUB_WORKSPACE/mediascan-config.yml" "$GITHUB_WORKSPACE/mediascan-artists.yml" "$GITHUB_WORKSPACE"

      - name: Upload mediascan-artists.yml artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediascan-artists
          path: ${{ github.workspace }}/mediascan-artists.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Local Python Packages
        run: |
          python -m pip install pandas-stubs
          python -m pip install --force-reinstall -e ./moongas-mediascan-python
          python -m pip install --force-reinstall -e ./moongas-py-mediatest

      - name: Run mediatest on moongas-collection
        run: |
          python -m mediatest --log-level=DEBUG -v -k "not test_album_dir_is_not_empty and not test_album_cover_exists" "$GITHUB_WORKSPACE/mediatest-config.yml"
